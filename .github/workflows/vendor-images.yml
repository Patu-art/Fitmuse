name: Download and vendor fashion imagery

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - ".github/workflows/vendor-images.yml"

permissions:
  contents: write

jobs:
  download-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download image files into the repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1617137968427-85924c800a22?fit=crop&w=1800&h=900&q=82&fm=jpg" -o assets/hero.jpg
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1488161628813-04466f872be2?fit=crop&w=900&h=1200&q=82&fm=jpg" -o assets/smart-casual.jpg
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?fit=crop&w=900&h=1200&q=82&fm=jpg" -o assets/street-style.jpg
          curl -fL --retry 3 --retry-delay 2 "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?fit=crop&w=900&h=1200&q=82&fm=jpg" -o assets/festive-style.jpg
          file assets/*.jpg
          test -s assets/hero.jpg
          test -s assets/smart-casual.jpg
          test -s assets/street-style.jpg
          test -s assets/festive-style.jpg

      - name: Commit downloaded local assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Add locally stored fashion imagery"
            git push
          fi
